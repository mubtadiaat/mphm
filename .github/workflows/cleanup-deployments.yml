name: Auto Cleanup GitHub Deployments (Max 25)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  deployments: write

jobs:
  cleanup-deployments:
    name: Prune Deployments (Keep max 25)
    runs-on: ubuntu-latest
    steps:
      - name: Delete Old Deployment Records
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              owner,
              repo,
              per_page: 100,
            });

            console.log(`Found ${deployments.length} total deployments.`);
            if (deployments.length > 25) {
              const toDelete = deployments.slice(25);
              console.log(`Pruning ${toDelete.length} old deployments...`);
              for (const dep of toDelete) {
                try {
                  // Inactivate first if active
                  await github.rest.repos.createDeploymentStatus({
                    owner,
                    repo,
                    deployment_id: dep.id,
                    state: 'inactive',
                  });
                  // Delete deployment record
                  await github.rest.repos.deleteDeployment({
                    owner,
                    repo,
                    deployment_id: dep.id,
                  });
                } catch (err) {
                  console.warn(`Could not delete deployment ${dep.id}:`, err.message);
                }
              }
            }
