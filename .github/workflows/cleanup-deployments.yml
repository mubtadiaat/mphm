name: Auto Cleanup GitHub Deployments (Max 25 Successful Only)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  deployments: write

jobs:
  cleanup-deployments:
    name: Prune Deployments (Keep max 25 successful, delete all failed)
    runs-on: ubuntu-latest
    steps:
      - name: Delete Failed & Old Deployment Records
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              owner,
              repo,
              per_page: 100,
            });

            console.log(`Total deployment records found: ${deployments.length}`);

            const successfulDeployments = [];
            const failedDeploymentsToDelete = [];

            for (const dep of deployments) {
              try {
                const statuses = await github.rest.repos.listDeploymentStatuses({
                  owner,
                  repo,
                  deployment_id: dep.id,
                  per_page: 1,
                });

                const latestState = statuses.data.length > 0 ? statuses.data[0].state : 'unknown';

                if (latestState === 'success') {
                  successfulDeployments.push(dep);
                } else {
                  failedDeploymentsToDelete.push(dep);
                }
              } catch (err) {
                failedDeploymentsToDelete.push(dep);
              }
            }

            console.log(`Successful deployments: ${successfulDeployments.length}, Failed/Errored deployments: ${failedDeploymentsToDelete.length}`);

            // Keep max 25 latest successful deployments, delete overflow + all failed ones
            const overflowSuccessful = successfulDeployments.slice(25);
            const allToDelete = [...failedDeploymentsToDelete, ...overflowSuccessful];

            console.log(`Deleting ${allToDelete.length} deployment records (${failedDeploymentsToDelete.length} failed/errored + ${overflowSuccessful.length} old successful)...`);

            for (const dep of allToDelete) {
              try {
                await github.rest.repos.createDeploymentStatus({
                  owner,
                  repo,
                  deployment_id: dep.id,
                  state: 'inactive',
                });
                await github.rest.repos.deleteDeployment({
                  owner,
                  repo,
                  deployment_id: dep.id,
                });
              } catch (err) {
                console.warn(`Could not delete deployment ${dep.id}:`, err.message);
              }
            }

            console.log(`Cleanup completed! Remaining successful deployments: ${Math.min(successfulDeployments.length, 25)}`);
