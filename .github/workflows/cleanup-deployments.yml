name: Auto Cleanup GitHub Actions & Deployments (Max 9 Successful Only)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  deployments: write
  contents: write

jobs:
  cleanup-actions-and-deployments:
    name: Prune Workflow Runs & Deployments (Keep Max 9 Successful)
    runs-on: ubuntu-latest
    steps:
      - name: Delete Old Actions Workflow Runs (Keep Max 9)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;

            try {
              const workflows = await github.rest.actions.listRepoWorkflows({ owner, repo });
              console.log(`Found ${workflows.data.workflows.length} workflows to audit...`);

              for (const wf of workflows.data.workflows) {
                const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                  owner,
                  repo,
                  workflow_id: wf.id,
                  per_page: 100,
                });

                console.log(`Workflow '${wf.name}': total ${runs.length} runs.`);

                const successful = runs.filter(r => r.status === 'completed' && r.conclusion === 'success');
                const nonSuccessful = runs.filter(r => r.status !== 'in_progress' && r.conclusion !== 'success');

                const overflowSuccessful = successful.slice(9);
                const toDelete = [...nonSuccessful, ...overflowSuccessful];

                console.log(`Workflow '${wf.name}': deleting ${toDelete.length} runs (keeping max 9 successful)...`);

                for (const run of toDelete) {
                  try {
                    await github.rest.actions.deleteWorkflowRun({
                      owner,
                      repo,
                      run_id: run.id,
                    });
                  } catch (err) {
                    console.warn(`Could not delete run ${run.id}:`, err.message);
                  }
                }
              }
            } catch (err) {
              console.error("Workflow runs cleanup error:", err.message);
            }

      - name: Delete Old GitHub Deployment Records (Keep Max 9)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;

            try {
              const deployments = await github.paginate(github.rest.repos.listDeployments, {
                owner,
                repo,
                per_page: 100,
              });

              console.log(`Total deployment records found: ${deployments.length}`);

              const successfulDeployments = [];
              const failedDeploymentsToDelete = [];

              for (const dep of deployments) {
                try {
                  const statuses = await github.rest.repos.listDeploymentStatuses({
                    owner,
                    repo,
                    deployment_id: dep.id,
                    per_page: 1,
                  });

                  const latestState = statuses.data.length > 0 ? statuses.data[0].state : 'unknown';

                  if (latestState === 'success') {
                    successfulDeployments.push(dep);
                  } else {
                    failedDeploymentsToDelete.push(dep);
                  }
                } catch (err) {
                  failedDeploymentsToDelete.push(dep);
                }
              }

              const overflowSuccessful = successfulDeployments.slice(9);
              const allToDelete = [...failedDeploymentsToDelete, ...overflowSuccessful];

              console.log(`Deleting ${allToDelete.length} deployment records (keeping max 9 successful)...`);

              for (const dep of allToDelete) {
                try {
                  await github.rest.repos.createDeploymentStatus({
                    owner,
                    repo,
                    deployment_id: dep.id,
                    state: 'inactive',
                  });
                  await github.rest.repos.deleteDeployment({
                    owner,
                    repo,
                    deployment_id: dep.id,
                  });
                } catch (err) {
                  console.warn(`Could not delete deployment ${dep.id}:`, err.message);
                }
              }

              console.log(`Cleanup completed!`);
            } catch (err) {
              console.error("Deployments cleanup error:", err.message);
            }
