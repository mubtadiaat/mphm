name: Auto Cleanup GitHub Releases & Old Workflows

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  actions: write
  deployments: write
  contents: write

jobs:
  purge-old-releases-and-runs:
    name: Purge Legacy Builds & Workflows Before Flutter Build
    runs-on: ubuntu-latest
    steps:
      - name: Purge Old Workflow Runs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;

            try {
              const workflows = await github.rest.actions.listRepoWorkflows({ owner, repo });
              console.log(`Found ${workflows.data.workflows.length} workflows to audit...`);

              for (const wf of workflows.data.workflows) {
                const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                  owner,
                  repo,
                  workflow_id: wf.id,
                  per_page: 100,
                });

                console.log(`Workflow '${wf.name}': total ${runs.length} runs.`);

                const nonSuccessful = runs.filter(r => r.status !== 'in_progress');
                console.log(`Workflow '${wf.name}': deleting ${nonSuccessful.length} old runs...`);

                for (const run of nonSuccessful) {
                  try {
                    await github.rest.actions.deleteWorkflowRun({
                      owner,
                      repo,
                      run_id: run.id,
                    });
                  } catch (err) {
                    console.warn(`Could not delete run ${run.id}:`, err.message);
                  }
                }
              }
            } catch (err) {
              console.error("Workflow runs cleanup error:", err.message);
            }

      - name: Purge Old GitHub Releases & Legacy Binaries
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;

            try {
              const releases = await github.rest.repos.listReleases({
                owner,
                repo,
                per_page: 100,
              });

              console.log(`Found ${releases.data.length} releases in GitHub.`);

              for (const rel of releases.data) {
                console.log(`Deleting legacy release ID: ${rel.id} (${rel.tag_name})...`);
                try {
                  await github.rest.repos.deleteRelease({
                    owner,
                    repo,
                    release_id: rel.id,
                  });
                } catch (e) {
                  console.warn(`Failed to delete release ${rel.id}:`, e.message);
                }
              }
              console.log("Legacy releases purged successfully!");
            } catch (err) {
              console.error("Release purge error:", err.message);
            }
