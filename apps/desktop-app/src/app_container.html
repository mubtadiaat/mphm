<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Mubtadiaat Desktop</title>
  <style>
    :root {
      --bg-color: #0b0f17;
      --titlebar-bg: #141b27;
      --border-color: #2e3a50;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --accent-glow: rgba(59, 130, 246, 0.35);
      --success-color: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Custom Titlebar */
    .titlebar {
      height: 42px;
      background-color: var(--titlebar-bg);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      -webkit-app-region: drag;
      border-bottom: 1px solid var(--border-color);
      z-index: 9999;
    }

    .titlebar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text-main);
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    .titlebar-logo {
      width: 22px;
      height: 22px;
      object-fit: contain;
    }

    .role-tag {
      font-size: 11px;
      padding: 2px 8px;
      background-color: rgba(59, 130, 246, 0.2);
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      border-radius: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .titlebar-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      -webkit-app-region: no-drag;
    }

    .control-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.15s ease;
    }

    .control-btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }

    .btn-close:hover {
      background-color: #ef4444;
      color: white;
    }

    /* Webview Container */
    .app-frame {
      flex: 1;
      width: 100%;
      height: calc(100vh - 42px);
      border: none;
      background-color: var(--bg-color);
    }

    /* In-App Floating/Modal Update Dialog */
    .update-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(4, 7, 13, 0.82);
      backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .update-modal-card {
      width: 460px;
      max-width: 90vw;
      background: #0f172a;
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9), 0 0 35px rgba(16, 185, 129, 0.25);
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }

    .modal-top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 14px;
    }

    .modal-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .modal-brand img {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }

    .modal-brand-text h3 {
      font-size: 15px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.3px;
    }

    .modal-brand-text p {
      font-size: 11px;
      color: #94a3b8;
      font-family: monospace;
    }

    .modal-close-btn {
      background: none;
      border: none;
      color: #64748b;
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
    }

    .modal-close-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
    }

    /* Version Info Box Grid */
    .version-info-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .version-card {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .version-card.highlight {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.15) 0%, rgba(20, 184, 166, 0.1) 100%);
      border-color: rgba(16, 185, 129, 0.4);
    }

    .version-card-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      font-weight: 700;
    }

    .version-card-val {
      font-size: 16px;
      font-weight: 800;
      font-family: monospace;
      color: #ffffff;
    }

    .version-card.highlight .version-card-val {
      color: #34d399;
    }

    /* What's New / Changelog Box */
    .changelog-wrapper {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .changelog-header {
      font-size: 11px;
      font-weight: 700;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .changelog-body {
      background: #020617;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px 14px;
      max-height: 110px;
      overflow-y: auto;
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.6;
      font-family: monospace;
    }

    /* Progress Box */
    .modal-progress-container {
      display: none;
      flex-direction: column;
      gap: 6px;
      padding: 8px 0;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: #1e293b;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #10b981 0%, #14b8a6 100%);
      transition: width 0.2s ease;
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #94a3b8;
      font-family: monospace;
    }

    /* Modal Actions */
    .modal-actions-bar {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding-top: 6px;
    }

    .btn-modal-cancel {
      padding: 10px 18px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-modal-cancel:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    .btn-modal-upgrade {
      padding: 10px 22px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #020617;
      border: none;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.3px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
      transition: transform 0.15s, opacity 0.2s;
    }

    .btn-modal-upgrade:hover {
      transform: translateY(-1px);
      opacity: 0.95;
    }
  </style>
</head>
<body>
  <!-- Titlebar -->
  <div class="titlebar">
    <div class="titlebar-brand">
      <img src="logo.webp" alt="Admin Mubtadiaat Logo" class="titlebar-logo" />
      <span>Admin Mubtadiaat</span>
      <span id="roleTag" class="role-tag">Sekretariat</span>
    </div>
    <div class="titlebar-controls">
      <button class="control-btn" id="btnMin" title="Minimize">&#x2212;</button>
      <button class="control-btn" id="btnMax" title="Maximize">&#x25A2;</button>
      <button class="control-btn btn-close" id="btnClose" title="Tutup">&#x2715;</button>
    </div>
  </div>

  <!-- Web App View -->
  <webview id="webFrame" class="app-frame" src="https://m.p3hm.my.id/sekretariat" allowpopups></webview>

  <!-- In-App Custom Update Modal Dialog (Modern Glassmorphism) -->
  <div id="updateToast" class="update-overlay">
    <div class="update-modal-card">
      <div class="modal-top-header">
        <div class="modal-brand">
          <img src="logo.webp" alt="P3HM Logo" />
          <div class="modal-brand-text">
            <h3>Pembaruan Sistem Tersedia</h3>
            <p>Admin Mubtadiaat Ecosystem</p>
          </div>
        </div>
        <button class="modal-close-btn" id="btnDismissToast">✕</button>
      </div>

      <!-- Version Information Boxes -->
      <div class="version-info-container">
        <div class="version-card">
          <span class="version-card-label">Versi Terpasang</span>
          <span class="version-card-val" id="toastCurrentVersion">-</span>
        </div>
        <div class="version-card highlight">
          <span class="version-card-label">Versi Terbaru</span>
          <span class="version-card-val" id="toastVersion">-</span>
        </div>
      </div>

      <!-- What's New Box (Changelog) -->
      <div class="changelog-wrapper">
        <div class="changelog-header">Catatan Pembaruan (What's New)</div>
        <div class="changelog-body" id="toastNotes">
          Memuat catatan pembaruan dari server...
        </div>
      </div>

      <!-- Download Progress Track -->
      <div class="modal-progress-container" id="toastProgressBox">
        <div class="progress-track">
          <div class="progress-fill" id="toastProgressFill"></div>
        </div>
        <div class="progress-text">
          <span id="toastProgressStatus">Mengunduh installer rilis baru...</span>
          <span id="toastProgressPercent">0%</span>
        </div>
      </div>

      <!-- Modal Action Buttons -->
      <div class="modal-actions-bar">
        <button class="btn-modal-cancel" id="btnUpdateLater">BATAL / NANTI</button>
        <button class="btn-modal-upgrade" id="btnUpdateNow">PERBARUI SEKARANG</button>
      </div>
    </div>
  </div>

  <script>
    function isAuthUrl(url) {
      if (!url) return false;
      const lower = url.toLowerCase();
      return lower.includes('accounts.google.com') ||
             lower.includes('google.com/o/oauth2') ||
             lower.includes('google.com/gsi/') ||
             lower.includes('firebaseapp.com') ||
             lower.includes('/__/auth/') ||
             lower.includes('auth/google') ||
             lower.includes('login/google');
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const btnMin = document.getElementById('btnMin');
      const btnMax = document.getElementById('btnMax');
      const btnClose = document.getElementById('btnClose');
      const roleTag = document.getElementById('roleTag');
      const webFrame = document.getElementById('webFrame');

      // Update Toast Elements
      const updateToast = document.getElementById('updateToast');
      const toastCurrentVersion = document.getElementById('toastCurrentVersion');
      const toastVersion = document.getElementById('toastVersion');
      const toastNotes = document.getElementById('toastNotes');
      const toastProgressBox = document.getElementById('toastProgressBox');
      const toastProgressFill = document.getElementById('toastProgressFill');
      const toastProgressStatus = document.getElementById('toastProgressStatus');
      const toastProgressPercent = document.getElementById('toastProgressPercent');
      const btnUpdateNow = document.getElementById('btnUpdateNow');
      const btnUpdateLater = document.getElementById('btnUpdateLater');
      const btnDismissToast = document.getElementById('btnDismissToast');

      if (window.electronAPI) {
        const config = await window.electronAPI.getConfig();
        if (config && config.role) {
          roleTag.textContent = config.role;
        }
        if (config && config.currentVersion) {
          toastCurrentVersion.textContent = `v${config.currentVersion}`;
        }
        if (config && config.targetUrl) {
          webFrame.src = config.targetUrl;
        }

        btnMin.addEventListener('click', () => window.electronAPI.minimizeWindow());
        btnMax.addEventListener('click', () => window.electronAPI.maximizeWindow());
        btnClose.addEventListener('click', () => window.electronAPI.closeWindow());

        // External Link Interceptor
        webFrame.addEventListener('dom-ready', () => {
          const handleExternal = (e) => {
            const targetUrl = e.url;
            if (targetUrl) {
              if (isAuthUrl(targetUrl)) {
                e.preventDefault();
                window.electronAPI.openExternal(targetUrl);
                return;
              }

              const lowerUrl = targetUrl.toLowerCase();
              const isInternal = lowerUrl.includes('p3hm.my.id') || lowerUrl.includes('localhost');
              if (!isInternal) {
                e.preventDefault();
                window.electronAPI.openExternal(targetUrl);
              }
            }
          };

          webFrame.addEventListener('will-navigate', handleExternal);
        });

        // Deep Link Auth Listener
        if (window.electronAPI.onDeepLinkAuth) {
          window.electronAPI.onDeepLinkAuth((data) => {
            console.log('Deep link auth callback received:', data);
            if (data && data.role && roleTag) {
              roleTag.textContent = data.role;
            }
            if (webFrame) {
              if (data && data.targetUrl) {
                webFrame.src = data.targetUrl;
              } else {
                webFrame.reload();
              }
            }
          });
        }

        // Background AutoUpdater Listeners
        if (window.electronAPI.onUpdateAvailable) {
          window.electronAPI.onUpdateAvailable((info) => {
            if (toastCurrentVersion && info && info.currentVersion) {
              toastCurrentVersion.textContent = `v${info.currentVersion}`;
            }
            if (info && info.version) {
              toastVersion.textContent = `v${info.version}`;
            }
            if (info && info.releaseNotes) {
              toastNotes.innerHTML = typeof info.releaseNotes === 'string' 
                ? info.releaseNotes 
                : (Array.isArray(info.releaseNotes) ? info.releaseNotes.join('<br>') : toastNotes.innerHTML);
            }
            updateToast.style.display = 'flex';
          });
        }

        if (window.electronAPI.onUpdateProgress) {
          window.electronAPI.onUpdateProgress((progressObj) => {
            toastProgressBox.style.display = 'flex';
            const percent = Math.round(progressObj.percent || 0);
            toastProgressFill.style.width = `${percent}%`;
            toastProgressPercent.textContent = `${percent}%`;
            toastProgressStatus.textContent = `Mengunduh (${(progressObj.bytesPerSecond / 1024 / 1024).toFixed(1)} MB/s)...`;
          });
        }

        if (window.electronAPI.onUpdateDownloaded) {
          window.electronAPI.onUpdateDownloaded((info) => {
            toastProgressBox.style.display = 'none';
            document.querySelector('.modal-brand-text h3').textContent = '✅ Update Siap Pasang';
            btnUpdateNow.textContent = 'RESTART & INSTALL';
            btnUpdateNow.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
            btnUpdateNow.onclick = () => {
              window.electronAPI.quitAndInstallUpdate();
            };
            updateToast.style.display = 'flex';
          });
        }

        btnUpdateNow.addEventListener('click', () => {
          if (btnUpdateNow.textContent.includes('RESTART')) {
            window.electronAPI.quitAndInstallUpdate();
          } else {
            btnUpdateNow.disabled = true;
            btnUpdateNow.textContent = 'MENGUNDUH...';
            toastProgressBox.style.display = 'flex';
            window.electronAPI.startUpdateDownload();
          }
        });

        btnUpdateLater.addEventListener('click', () => {
          updateToast.style.display = 'none';
        });

        btnDismissToast.addEventListener('click', () => {
          updateToast.style.display = 'none';
        });
      }
    });
  </script>
</body>
</html>
