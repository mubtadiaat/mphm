name: mphm_app
description: "Aplikasi Enterprise Multi-Platform MPHM & P3HM Lirboyo (Android & Windows Desktop)"
publish_to: 'none'
version: 2.0.1+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Icons & Styling
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  animate_do: ^3.3.4

  # State Management & DI
  flutter_riverpod: ^2.5.1
  
  # Network & Authentication
  dio: ^5.4.0
  google_sign_in: ^6.2.1
  local_auth: ^2.1.8
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  jwt_decoder: ^2.0.1

  # UI Components & Responsiveness
  responsive_framework: ^1.4.0
  curved_navigation_bar: ^1.0.6
  data_table_2: ^2.5.11
  cached_network_image: ^3.3.1

  # Local DB & Utilities
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.19.0
  url_launcher: ^6.2.5
  mobile_scanner: ^5.1.1
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
