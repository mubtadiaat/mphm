name: Enterprise Flutter App Build & Release Pipeline (mubtadiaat/app_software)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  deployments: write

jobs:
  # -------------------------------------------------------------------
  # 1. BUILD RELEASE APK & AAB (ANDROID WITH JDK 17 & LATEST FLUTTER STABLE)
  # -------------------------------------------------------------------
  build-android-release:
    name: Build Release Android Binary (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Latest Flutter SDK (Stable 3.27+)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enforce Odd Version & Rollover Policy (> .39)
        id: version_check
        run: |
          RAW_VER=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
          echo "Raw version from pubspec: $RAW_VER"
          
          # Parse Major, Minor, Patch
          MAJOR=$(echo $RAW_VER | cut -d'.' -f1)
          MINOR=$(echo $RAW_VER | cut -d'.' -f2)
          PATCH=$(echo $RAW_VER | cut -d'.' -f3)
          
          # Check Patch Rollover (> 39) -> Rollover to Minor + 1, Patch = 1
          if [ "$PATCH" -gt 39 ]; then
            MINOR=$((MINOR + 1))
            PATCH=1
            echo "Rollover triggered! Patch > 39 -> New Version: $MAJOR.$MINOR.$PATCH"
          fi

          # Ensure Patch is Odd
          if [ $((PATCH % 2)) -eq 0 ]; then
            PATCH=$((PATCH + 1))
            echo "Odd version rule enforced! Patch was even -> Adjusted to: $MAJOR.$MINOR.$PATCH"
          fi

          FINAL_VER="$MAJOR.$MINOR.$PATCH"
          echo "APP_VERSION=$FINAL_VER" >> $GITHUB_ENV
          echo "Enforced Release Version: $FINAL_VER"

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK & AAB
        run: |
          flutter build apk --release --android-skip-build-dependency-validation
          flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Rename APK Artifacts with Version Tag
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Mubtadiaat-v${{ env.APP_VERSION }}.apk
          cp build/app/outputs/flutter-apk/app-release.apk e-Mubtadiaat-v${{ env.APP_VERSION }}.apk

      - name: Generate Production Release Keystore & Extract SHA Fingerprints
        run: |
          mkdir -p ~/.android

          # 1. Generate Production Release Keystore
          if [ ! -f ~/.android/release.keystore ]; then
            keytool -genkey -v -keystore ~/.android/release.keystore \
              -storepass androidrelease -alias androidreleasekey -keypass androidrelease \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=P3HM Lirboyo Release,OU=IT,O=P3HM Lirboyo,L=Kediri,ST=Jawa Timur,C=ID" > /dev/null 2>&1 || true
          fi

          # 2. Generate Debug Keystore
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" > /dev/null 2>&1 || true
          fi

          # 3. Export SHA-1 and SHA-256 for BOTH Keystores to GITHUB_STEP_SUMMARY
          {
            echo "### 🔑 Android RELEASE Keystore Signing Fingerprints (Production Official)"
            echo "> **Daftarkan SHA-1 & SHA-256 RELEASE ini ke Firebase Console → Project Settings → Android App**"
            echo ""
            echo '```text'
            keytool -list -v \
              -keystore ~/.android/release.keystore \
              -alias androidreleasekey \
              -storepass androidrelease \
              -keypass androidrelease 2>/dev/null \
              | grep -E "Alias|SHA1|SHA256|MD5" || echo "SHA Release Error"
            echo '```'
            echo ""
            echo "---"
            echo ""
            echo "### 🔑 Android DEBUG Keystore Fingerprints (Development Test)"
            echo '```text'
            keytool -list -v \
              -keystore ~/.android/debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android 2>/dev/null \
              | grep -E "Alias|SHA1|SHA256|MD5" || echo "SHA Debug Error"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android APK Artifact (Staff Mustahiq)
        uses: actions/upload-artifact@v4
        with:
          name: mphm-android-staff-apk
          path: Mubtadiaat-v*.apk

      - name: Upload Android APK Artifact (Wali Santri/Guardian)
        uses: actions/upload-artifact@v4
        with:
          name: mphm-android-guardian-apk
          path: e-Mubtadiaat-v*.apk

  # -------------------------------------------------------------------
  # 2. BUILD RELEASE WINDOWS DESKTOP + INNOSETUP INSTALLER
  # -------------------------------------------------------------------
  build-windows-release:
    name: Build Release Windows Desktop Binary (.exe Installer)
    runs-on: windows-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup MSVC C++ Development Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Latest Flutter SDK (Stable 3.27+)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Prepare Windows Build Environment
        run: |
          Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue
          flutter pub get

      - name: Build Windows Desktop App
        run: flutter build windows --release

      - name: Read & Enforce Odd Version from pubspec.yaml
        id: get_version
        run: |
          $rawVer = (Get-Content pubspec.yaml | Select-String 'version:' | Select-Object -First 1).Line.Trim().Split(' ')[1].Split('+')[0]
          $parts = $rawVer.Split('.')
          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]$parts[2]

          if ($patch -gt 39) {
            $minor = $minor + 1
            $patch = 1
          }
          if ($patch % 2 -eq 0) {
            $patch = $patch + 1
          }

          $finalVer = "$major.$minor.$patch"
          echo "APP_VERSION=$finalVer" >> $env:GITHUB_ENV
          echo "Version detected & enforced: $finalVer"

      - name: Rename Windows Executable to Professional Name
        run: |
          $relDir = "build\windows\x64\runner\Release"
          if (Test-Path "$relDir\mphm_app.exe") {
            Rename-Item "$relDir\mphm_app.exe" "MPHM.Enterprise.exe"
            echo "Renamed mphm_app.exe -> MPHM.Enterprise.exe"
          }

      - name: Install InnoSetup 6 (Professional Installer Builder)
        run: |
          choco install innosetup --no-progress -y
          echo "InnoSetup installed successfully."

      - name: Create InnoSetup Script
        run: |
          $issContent = @"
          [Setup]
          AppName=MPHM Enterprise - P3HM & Lirboyo Kediri
          AppVersion=${{ env.APP_VERSION }}
          AppPublisher=P3HM Lirboyo Kediri
          AppPublisherURL=https://m.p3hm.my.id
          AppSupportURL=https://m.p3hm.my.id
          AppUpdatesURL=https://github.com/mubtadiaat/app_software/releases
          DefaultDirName={autopf}\MPHM Enterprise
          DefaultGroupName=MPHM Enterprise
          AllowNoIcons=yes
          OutputDir=installer_output
          OutputBaseFilename=MPHM.Enterprise.Setup.${{ env.APP_VERSION }}
          Compression=lzma2/ultra64
          SolidCompression=yes
          WizardStyle=modern
          UninstallDisplayName=MPHM Enterprise - P3HM & Lirboyo Kediri
          UninstallDisplayIcon={app}\MPHM.Enterprise.exe
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          SetupIconFile=windows\runner\resources\app_icon.ico
          DisableWelcomePage=no

          [Languages]
          Name: "indonesian"; MessagesFile: "compiler:Default.isl"

          [Tasks]
          Name: "desktopicon"; Description: "Buat shortcut di Desktop"; GroupDescription: "Ikon tambahan:"; Flags: unchecked
          Name: "startmenuicon"; Description: "Buat shortcut di Start Menu"; GroupDescription: "Ikon tambahan:"; Flags: checkedonce

          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\MPHM Enterprise"; Filename: "{app}\MPHM.Enterprise.exe"
          Name: "{group}\Hapus Instalan MPHM Enterprise"; Filename: "{uninstallexe}"
          Name: "{autodesktop}\MPHM Enterprise"; Filename: "{app}\MPHM.Enterprise.exe"; Tasks: desktopicon

          [Run]
          Filename: "{app}\MPHM.Enterprise.exe"; Description: "Jalankan MPHM Enterprise sekarang"; Flags: nowait postinstall skipifsilent

          [UninstallDelete]
          Type: filesandordirs; Name: "{app}"
          "@
          New-Item -Path . -Name "mphm_installer.iss" -ItemType "file" -Value $issContent -Force
          echo "InnoSetup script created."

      - name: Compile Professional Installer via InnoSetup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" mphm_installer.iss
          echo "Installer compiled successfully."

      - name: Verify Installer Output
        run: |
          Get-ChildItem installer_output\ | Select-Object Name, Length
          if (!(Test-Path "installer_output\MPHM.Enterprise.Setup.${{ env.APP_VERSION }}.exe")) {
            echo "WARNING: Installer exe not found, falling back to zip package."
            Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "installer_output/MPHM.Enterprise.Setup.${{ env.APP_VERSION }}.exe" -ErrorAction SilentlyContinue
          }

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mphm-windows-installer
          path: installer_output/MPHM.Enterprise.Setup.*.exe

  # -------------------------------------------------------------------
  # 3. DAILY BUILD RETENTION & PUBLISH OFFICIAL GITHUB RELEASE
  # -------------------------------------------------------------------
  create-github-release:
    name: Publish GitHub Release Binaries
    needs: [build-android-release, build-windows-release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Read & Enforce Odd Version
        run: |
          RAW_VER=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
          MAJOR=$(echo $RAW_VER | cut -d'.' -f1)
          MINOR=$(echo $RAW_VER | cut -d'.' -f2)
          PATCH=$(echo $RAW_VER | cut -d'.' -f3)

          if [ "$PATCH" -gt 39 ]; then
            MINOR=$((MINOR + 1))
            PATCH=1
          fi

          if [ $((PATCH % 2)) -eq 0 ]; then
            PATCH=$((PATCH + 1))
          fi

          FINAL_VER="$MAJOR.$MINOR.$PATCH"
          echo "APP_VERSION=$FINAL_VER" >> $GITHUB_ENV
          echo "Building release for version: $FINAL_VER"

      - name: Execute Daily Build Retention & Legacy Tag Cleanup
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const currentTag = `v${process.env.APP_VERSION}`;

            console.log(`Executing Daily Build Retention Policy & Tag Cleanup for target tag: ${currentTag}...`);

            // 1. Kebijakan Retensi Build Harian (Daily Build Retention for Workflow Runs)
            // • Hari yang sama: Simpan 1 build TERBARU, hapus build lama di hari yang sama.
            // • Lintas tanggal: Simpan 1 build terbaru pada tanggal-tanggal sebelumnya.
            try {
              const runs = await github.rest.actions.listWorkflowRunsForRepo({ owner, repo, per_page: 100 });
              const runsByDate = {};

              for (const r of runs.data.workflow_runs) {
                const dateStr = r.created_at.split('T')[0];
                if (!runsByDate[dateStr]) runsByDate[dateStr] = [];
                runsByDate[dateStr].push(r);
              }

              for (const dateStr of Object.keys(runsByDate)) {
                const dayRuns = runsByDate[dateStr];
                if (dayRuns.length > 1) {
                  // Keep 1 latest run for that date, delete older runs of the same date
                  const olderRunsForDay = dayRuns.slice(1);
                  for (const r of olderRunsForDay) {
                    console.log(`[Daily Retention] Deleting duplicate run #${r.run_number} (ID: ${r.id}) for date ${dateStr}...`);
                    await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: r.id }).catch(e => console.error(e.message));
                  }
                }
              }
              console.log("Daily Workflow Run Retention applied successfully!");
            } catch (err) {
              console.error("Daily run retention error:", err.message);
            }

            // 2. Kebijakan Retensi Release Harian (Daily Release Retention)
            try {
              const releases = await github.rest.repos.listReleases({ owner, repo, per_page: 100 });
              const releasesByDate = {};

              for (const rel of releases.data) {
                const dateStr = (rel.published_at || rel.created_at).split('T')[0];
                if (!releasesByDate[dateStr]) releasesByDate[dateStr] = [];
                releasesByDate[dateStr].push(rel);
              }

              for (const dateStr of Object.keys(releasesByDate)) {
                const dayReleases = releasesByDate[dateStr];
                if (dayReleases.length > 1) {
                  const olderReleasesForDay = dayReleases.slice(1);
                  for (const rel of olderReleasesForDay) {
                    console.log(`[Daily Retention] Purging older release ${rel.name || rel.tag_name} (${rel.id}) for date ${dateStr}...`);
                    await github.rest.repos.deleteRelease({ owner, repo, release_id: rel.id }).catch(e => console.error(e.message));
                  }
                }
              }
              console.log("Daily Release Retention applied successfully!");
            } catch (err) {
              console.error("Daily release retention error:", err.message);
            }

            // 3. Purge all legacy v1.x tags
            try {
              const tags = await github.rest.repos.listTags({ owner, repo, per_page: 100 });
              for (const tag of tags.data) {
                if (tag.name.startsWith('v1.')) {
                  console.log(`Purging legacy v1 tag: ${tag.name}...`);
                  await github.rest.git.deleteRef({ owner, repo, ref: `tags/${tag.name}` }).catch(e => console.error(e.message));
                }
              }
              console.log("Legacy v1 tags purged successfully!");
            } catch (err) {
              console.error("Tag cleanup error:", err.message);
            }

      - name: Download Android Staff APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: mphm-android-staff-apk
          path: ./release-artifacts/

      - name: Download Android Guardian APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: mphm-android-guardian-apk
          path: ./release-artifacts/

      - name: Download Windows Installer Artifact
        uses: actions/download-artifact@v4
        with:
          name: mphm-windows-installer
          path: ./release-artifacts/

      - name: List Release Artifacts
        run: ls -lah ./release-artifacts/

      - name: Create Official GitHub Release (v${{ env.APP_VERSION }})
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-artifacts/*
          draft: false
          prerelease: false
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: "🚀 MPHM Enterprise v${{ env.APP_VERSION }} — Rilis Resmi"
          body: |
            ## 🏛️ MPHM & P3HM Lirboyo Enterprise — Rilis Resmi v${{ env.APP_VERSION }}

            Sistem Manajemen Santri & Pondok Pesantren — Platform Enterprise terpadu untuk P3HM & MPHM Lirboyo Kediri.

            ---

            ### 📦 Unduh Binari Rilis:

            | Platform | File | Keterangan |
            |---|---|---|
            | 💻 **Windows Desktop** | `MPHM.Enterprise.Setup.*.exe` | Installer resmi untuk Sekretariat & Admin |
            | 📱 **Android (Staff)** | `Mubtadiaat-v*.apk` | Aplikasi Staff Mustahiq & Pengurus |
            | 📱 **Android (Wali)** | `e-Mubtadiaat-v*.apk` | Aplikasi Wali Santri & Orang Tua |

            ---

            ### 🔑 Catatan Firebase SHA Fingerprint:
            Nilai SHA-1 & SHA-256 (Release Keystore & Debug Keystore) tersedia di tab **Summary → Build Actions** untuk didaftarkan ke Firebase Console.

            ---

            ### 📋 Persyaratan Sistem:
            - **Windows**: Windows 10 (64-bit) atau lebih baru
            - **Android**: Minimal Android 7.0 (API 24+)
            - **Koneksi**: Diperlukan koneksi internet untuk sinkronisasi data

            ---

            > *Dikembangkan & dikelola oleh Tim Teknis P3HM Lirboyo Kediri — [m.p3hm.my.id](https://m.p3hm.my.id)*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
