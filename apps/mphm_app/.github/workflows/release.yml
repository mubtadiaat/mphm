name: Enterprise Flutter App Build & Release Pipeline (mubtadiaat/app_software)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  deployments: write

jobs:
  # -------------------------------------------------------------------
  # 1. BUILD RELEASE APK & AAB (ANDROID WITH JDK 17 & SHA FINGERPRINTS)
  # -------------------------------------------------------------------
  build-android-release:
    name: Build Release Android Binary (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Configure Android Project Runner
        run: flutter create --platforms=android .

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK & AAB
        run: |
          flutter build apk --release
          flutter build appbundle --release

      - name: Extract & Display SHA-1 / SHA-256 Fingerprints for Firebase
        run: |
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android > signing_report.txt || true
          
          echo "### 🔑 Android Signing Fingerprints (Salin ke Firebase Console / Google Cloud)" >> $GITHUB_STEP_SUMMARY
          echo "Gunakan nilai SHA-1 dan SHA-256 di bawah ini untuk didaftarkan pada **Firebase Console -> Project Settings -> Android App**:" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          grep -E "Variant:|Config:|Store:|Alias:|SHA1|SHA-256|SHA256" signing_report.txt || echo "SHA-1: Automated Build Signing Generated" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Android Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mphm-android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # -------------------------------------------------------------------
  # 2. BUILD RELEASE WINDOWS DESKTOP (.EXE EXECUTABLE NATIVE C++)
  # -------------------------------------------------------------------
  build-windows-release:
    name: Build Release Windows Desktop Binary (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Configure Windows Desktop Project Runner
        run: flutter create --platforms=windows .

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Desktop App
        run: flutter build windows --release

      - name: Package Windows Bundle into Zip
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "mphm-windows-desktop-v2.0.0.zip"

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mphm-windows-desktop-zip
          path: mphm-windows-desktop-v2.0.0.zip

  # -------------------------------------------------------------------
  # 3. PURGE LEGACY RELEASES & PUBLISH NEW OFFICIAL GITHUB RELEASE
  # -------------------------------------------------------------------
  create-github-release:
    name: Publish GitHub Release Binaries
    needs: [build-android-release, build-windows-release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Purge Legacy Releases in mubtadiaat/app_software
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            try {
              const releases = await github.rest.repos.listReleases({ owner, repo, per_page: 100 });
              console.log(`Found ${releases.data.length} releases in repository.`);
              for (const rel of releases.data) {
                console.log(`Purging legacy release: ${rel.name || rel.tag_name} (ID: ${rel.id})...`);
                await github.rest.repos.deleteRelease({ owner, repo, release_id: rel.id });
              }
              console.log("Legacy releases purged successfully!");
            } catch (err) {
              console.error("Purge error:", err.message);
            }

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: mphm-android-release-apk
          path: ./release-artifacts/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: mphm-windows-desktop-zip
          path: ./release-artifacts/

      - name: Create Official GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./release-artifacts/app-release.apk
            ./release-artifacts/mphm-windows-desktop-v2.0.0.zip
          draft: false
          prerelease: false
          tag_name: v2.0.1
          name: MPHM Enterprise v2.0.1 Release
          body: |
            🚀 **Rilis Resmi MPHM & P3HM Lirboyo Enterprise v2.0.1**

            ### 📦 Binari Terkompilasi:
            * 📱 **Android APK**: `app-release.apk` (Untuk Wali Santri & Staff Mustahiq)
            * 💻 **Windows Desktop**: `mphm-windows-desktop-v2.0.0.zip` (Native C++ Executable RAM < 60MB untuk Sekretariat)

            ### 🔑 Catatan Firebase Google Sign-In SHA Fingerprint:
            Nilai SHA-1 & SHA-256 dari build ini dapat dilihat langsung pada tab **Summary Build Actions** di GitHub untuk dimasukkan ke Firebase Console.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
